<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Repair locally, widen the scope when needed</title><desc id="desc">Schematic ligand drawings and curved routes show the multi-component holdout: 127 poses enter local repair; 104 are resolved locally and 23 restart with ordinary relaxation. All 127 final outputs pass full validity. Blue regions indicate local versus whole-ligand freedom to move. Molecular geometry and paths are illustrative; route widths and lengths do not encode counts or time.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow-gray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a2abb7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6495ed" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#c98263" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="131" y="34" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="400">Try local repair</text><text x="131" y="61" font-size="15" fill="#6b6b6b" text-anchor="middle" font-weight="400">127 poses</text><g transform="translate(27 110) scale(1)"><ellipse cx="38" cy="24" rx="48" ry="39" transform="rotate(-18 38 24)" fill="#6495ed" fill-opacity="0.08" stroke="#6495ed" stroke-opacity="0.5" stroke-dasharray="3 5"/><ellipse cx="183" cy="39" rx="35" ry="48" fill="#6495ed" fill-opacity="0.08" stroke="#6495ed" stroke-opacity="0.5" stroke-dasharray="3 5"/><pat